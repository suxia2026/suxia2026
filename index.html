<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>积极探究者的小课堂 · 提问与回答</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js">
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'KaiTi', 'STKaiti', '楷体', 'YouYuan', '幼圆', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg,
          #ff9a9e 0%, #fecfef 8%, #fecfef 16%, #ffd1b3 24%,
          #fff1b0 32%, #d4f0c0 40%, #a8e6cf 48%, #b8e6f0 56%,
          #c4b0f0 64%, #f0b0d0 72%, #ffd1b3 80%, #fff1b0 88%,
          #fecfef 96%, #ff9a9e 100%);
      background-size: 400% 400%;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      animation: rainbowShift 20s ease-in-out infinite;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 0%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }

    .app-container {
      max-width: 1400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(30px);
      border-radius: 48px;
      box-shadow: 0 30px 80px rgba(255, 150, 180, 0.25), 0 12px 30px rgba(180, 200, 255, 0.2), inset 0 2px 0 rgba(255, 255, 255, 0.9);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 4px solid rgba(255, 200, 215, 0.5);
      position: relative;
      z-index: 1;
      margin: auto;
    }

    .page {
      display: none;
      padding: 40px;
      flex-direction: column;
      gap: 28px;
      position: relative;
    }

    .page.active {
      display: flex;
    }

    /* 登录页垂直居中 */
    #loginPage.active {
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(15px);
      border-radius: 40px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(255, 180, 200, 0.2), 0 4px 12px rgba(180, 200, 240, 0.15), inset 0 2px 0 rgba(255, 255, 255, 0.8);
      border: 3px solid rgba(255, 220, 235, 0.5);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 30px;
      right: 30px;
      height: 6px;
      background: linear-gradient(90deg, #ff9a9e, #fecfef, #ffd1b3, #fff1b0, #d4f0c0, #a8e6cf, #b8e6f0, #c4b0f0, #f0b0d0, #ff9a9e);
      background-size: 200% 100%;
      border-radius: 6px;
      animation: cardRainbowBorder 4s linear infinite;
    }

    @keyframes cardRainbowBorder {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    h2 {
      font-family: 'KaiTi', 'STKaiti', '楷体', 'YouYuan', '幼圆', sans-serif;
      font-size: 3.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff6b8a 0%, #c084fc 50%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 28px;
      letter-spacing: 3px;
      padding-bottom: 16px;
      border-bottom: 5px dotted rgba(255, 180, 200, 0.5);
      text-align: center;
    }

    h3 {
      font-family: 'KaiTi', 'STKaiti', '楷体', 'YouYuan', '幼圆', sans-serif;
      font-size: 2.2rem;
      color: #8b5cf6;
      margin: 20px 0 16px;
      text-align: center;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      margin-bottom: 22px;
      justify-content: center;
    }

    .input-group label {
      font-family: 'KaiTi', 'STKaiti', '楷体', 'YouYuan', '幼圆', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      background: linear-gradient(135deg, #f472b6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      min-width: 90px;
      text-align: right;
    }

    input,
    select,
    textarea {
      font-family: 'KaiTi', 'STKaiti', '楷体', 'YouYuan', '幼圆', 'PingFang SC', sans-serif;
      padding: 16px 24px;
      border: 3px solid rgba(255, 180, 210, 0.5);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.8);
      font-size: 1.7rem;
      outline: none;
      transition: all 0.3s ease;
      max-width: 220px;
      text-align: center;
      letter-spacing: 2px;
      color: #5b3a4a;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #f9a8d4;
      box-shadow: 0 0 30px rgba(249, 168, 212, 0.35), 0 0 12px rgba(196, 176, 240, 0.25);
      background: #ffffff;
      transform: scale(1.03);
    }

    button {
      font-family: 'KaiTi', 'STKaiti', '楷体', 'YouYuan', '幼圆', sans-serif;
      background: linear-gradient(135deg, #fda4af 0%, #f9a8d4 30%, #c4b5fd 60%, #93c5fd 100%);
      background-size: 200% 200%;
      border: none;
      color: white;
      font-weight: 700;
      padding: 18px 40px;
      border-radius: 50px;
      font-size: 1.7rem;
      cursor: pointer;
      transition: all 0.4s ease;
      animation: cuteButtonGlow 3s ease infinite;
      letter-spacing: 2.5px;
      box-shadow: 0 10px 30px rgba(253, 164, 175, 0.35);
      border: 3px solid rgba(255, 255, 255, 0.5);
    }

    @keyframes cuteButtonGlow {
      0%,
      100% { box-shadow: 0 10px 30px rgba(253, 164, 175, 0.35); }
      50% { box-shadow: 0 16px 45px rgba(196, 181, 253, 0.5), 0 0 35px rgba(147, 197, 253, 0.4); }
    }

    button:hover {
      transform: translateY(-5px) scale(1.04);
      box-shadow: 0 16px 45px rgba(253, 164, 175, 0.5), 0 0 45px rgba(196, 181, 253, 0.45);
      background-position: 100% 50%;
    }

    button:active {
      transform: translateY(0) scale(0.97);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.75);
      color: #e75480;
      border: 3px solid rgba(249, 168, 212, 0.5);
      box-shadow: 0 5px 18px rgba(255, 180, 200, 0.2);
      animation: none;
      backdrop-filter: blur(10px);
    }

    button.secondary:hover {
      background: rgba(255, 240, 245, 0.9);
      border-color: #f9a8d4;
      color: #d6336c;
    }

    button.rubric-btn {
      color: #1e3a8a !important;
      font-weight: 700;
    }

    button.nav-btn {
      animation: none;
      background: linear-gradient(135deg, #93c5fd, #c4b5fd);
      font-size: 1.4rem;
      padding: 14px 30px;
      min-width: 100px;
    }

    .flex-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      justify-content: center;
    }

    .text-section {
      background: rgba(255, 250, 252, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 28px;
      border: 3px solid rgba(255, 210, 225, 0.5);
      box-shadow: 0 6px 24px rgba(255, 180, 200, 0.15);
    }

    .prompt-box {
      background: linear-gradient(135deg, #fff5f9 0%, #f5f0ff 50%, #f0f9ff 100%);
      padding: 22px 28px;
      border-radius: 26px;
      margin-bottom: 28px;
      font-size: 1.6rem;
      color: #6b3a5a;
      border: 3px dashed rgba(249, 168, 212, 0.4);
      text-align: center;
      line-height: 2;
    }

    .question-item {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border: 3px solid rgba(255, 200, 220, 0.5);
      border-radius: 32px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 6px 24px rgba(255, 180, 200, 0.12);
      font-size: 1.6rem;
    }

    .version-block {
      background: linear-gradient(135deg, #fff5f9 0%, #f8f4ff 100%);
      border-radius: 18px;
      padding: 14px 18px;
      margin: 10px 0;
      border-left: 6px solid #f9a8d4;
      font-size: 1.4rem;
      color: #5b3a4a;
    }

    .score-badge {
      background: linear-gradient(135deg, #fda4af 0%, #c4b5fd 100%);
      border-radius: 30px;
      padding: 8px 22px;
      font-weight: 700;
      color: white;
      font-size: 1.4rem;
      box-shadow: 0 5px 15px rgba(253, 164, 175, 0.3);
    }

    .small-btn {
      padding: 10px 22px;
      font-size: 1.3rem;
      border-radius: 28px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      resize: vertical;
      font-family: 'KaiTi', 'STKaiti', '楷体', 'YouYuan', '幼圆', sans-serif;
      font-size: 1.6rem;
    }

    .answer-row {
      background: rgba(255, 248, 250, 0.8);
      border-radius: 20px;
      padding: 16px 22px;
      margin-top: 12px;
      border: 2px solid rgba(255, 200, 220, 0.4);
      font-size: 1.4rem;
    }

    .answer-score-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    #qrCodeContainer {
      background: white;
      padding: 24px;
      border-radius: 32px;
      display: inline-block;
      margin: 16px 0;
      box-shadow: 0 10px 30px rgba(255, 180, 200, 0.25);
      border: 3px solid rgba(249, 168, 212, 0.4);
    }

    .student-login-area {
      background: linear-gradient(135deg, #fff5f9 0%, #f5f0ff 100%);
      padding: 24px;
      border-radius: 28px;
      margin: 20px 0;
      border: 3px dashed rgba(249, 168, 212, 0.5);
      text-align: center;
      font-size: 1.6rem;
    }

    #lessonContent {
      white-space: pre-wrap;
      max-height: 500px;
      overflow-y: auto;
      padding: 20px;
      line-height: 2.2;
      color: #5b3a4a;
      font-family: 'KaiTi', 'STKaiti', '楷体', 'YouYuan', '幼圆', sans-serif;
      font-size: 1.8rem;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 1.4rem;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      overflow: hidden;
    }

    .report-table th {
      background: linear-gradient(135deg, #fda4af, #c4b5fd);
      color: white;
      padding: 16px;
      font-weight: 700;
      font-size: 1.5rem;
    }

    .report-table td {
      padding: 14px 16px;
      border-bottom: 2px solid rgba(249, 168, 212, 0.3);
      color: #5b3a4a;
      text-align: center;
    }

    .report-table tr:nth-child(even) td {
      background: rgba(255, 240, 245, 0.3);
    }

    .highlight-box {
      background: linear-gradient(135deg, #fff5f9, #f5f0ff);
      border-radius: 20px;
      padding: 20px;
      margin: 14px 0;
      border: 2px solid rgba(249, 168, 212, 0.4);
    }

    .nav-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px);
      border-radius: 36px;
      padding: 36px;
      max-width: 900px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.3);
      border: 4px solid rgba(249, 168, 212, 0.5);
      position: relative;
      font-size: 1.6rem;
    }

    .modal-content h3 {
      font-size: 2.4rem;
      color: #d6336c;
      margin-bottom: 24px;
      text-align: center;
    }

    .modal-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 1.5rem;
    }

    .modal-content table th {
      background: linear-gradient(135deg, #fda4af, #c4b5fd);
      color: white;
      padding: 16px;
      border-radius: 12px 12px 0 0;
      font-weight: 700;
      font-size: 1.6rem;
    }

    .modal-content table td {
      padding: 16px;
      border-bottom: 2px solid rgba(249, 168, 212, 0.3);
      color: #5b3a4a;
      vertical-align: top;
      line-height: 1.8;
    }

    .modal-close-btn {
      position: absolute;
      top: 18px;
      right: 24px;
      background: #fda4af;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: none;
    }

    .modal-close-btn:hover {
      background: #e75480;
      transform: scale(1.1);
    }

    /* ---- 报告分页样式 ---- */
    .report-subpage {
      display: none;
      flex-direction: column;
      min-height: 500px;
    }

    .report-subpage.active {
      display: flex;
    }

    /* 第一页统计表格容器：占满页面 */
    #reportStatsPage {
      flex: 1;
      min-height: 70vh;
      justify-content: flex-start;
    }

    #reportStatsPage .table-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 400px;
    }

    #reportStatsPage .table-wrapper table {
      flex: 1;
      width: 100%;
      border-collapse: collapse;
      font-size: 1.4rem;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      overflow: hidden;
      margin: 0;
    }

    #reportStatsPage .table-wrapper table th {
      background: linear-gradient(135deg, #fda4af, #c4b5fd);
      color: white;
      padding: 16px;
      font-weight: 700;
      font-size: 1.5rem;
    }

    #reportStatsPage .table-wrapper table td {
      padding: 14px 16px;
      border-bottom: 2px solid rgba(249, 168, 212, 0.3);
      color: #5b3a4a;
      text-align: center;
    }

    #reportStatsPage .table-wrapper table tr:nth-child(even) td {
      background: rgba(255, 240, 245, 0.3);
    }

    /* 报告导航 */
    .report-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 20px 0 10px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 40px;
      backdrop-filter: blur(10px);
    }

    .report-nav button {
      padding: 10px 28px;
      font-size: 1.4rem;
      min-width: 80px;
      animation: none;
      background: linear-gradient(135deg, #93c5fd, #c4b5fd);
    }

    .report-nav button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .report-nav .page-indicator {
      font-size: 1.6rem;
      color: #5b3a4a;
      font-weight: 700;
      min-width: 80px;
      text-align: center;
    }

    /* 第二页个人反思卡片 */
    .individual-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 28px 32px;
      margin-bottom: 28px;
      border: 3px solid rgba(255, 200, 220, 0.5);
      box-shadow: 0 6px 24px rgba(255, 180, 200, 0.12);
    }

    .individual-card .user-name {
      font-size: 2.2rem;
      font-weight: 700;
      color: #8b5cf6;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .individual-card .dimension-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .individual-card .dimension-item {
      background: rgba(255, 248, 250, 0.7);
      border-radius: 20px;
      padding: 16px 20px;
      border-left: 6px solid #f9a8d4;
    }

    .individual-card .dimension-item .label {
      font-weight: 700;
      color: #d6336c;
      font-size: 1.4rem;
      display: block;
      margin-bottom: 6px;
    }

    .individual-card .dimension-item .text {
      font-size: 1.4rem;
      color: #5b3a4a;
      line-height: 1.6;
      margin: 4px 0;
    }

    .individual-card .dimension-item .score {
      font-weight: 700;
      color: #8b5cf6;
      font-size: 1.3rem;
    }

    .individual-card .no-data {
      color: #b07a8e;
      font-style: italic;
      font-size: 1.3rem;
    }

    @media (max-width: 768px) {
      .individual-card .dimension-grid {
        grid-template-columns: 1fr;
      }
      body {
        padding: 15px;
      }
      .app-container {
        border-radius: 32px;
      }
      .page {
        padding: 20px;
        gap: 16px;
      }
      h2 {
        font-size: 2.2rem;
      }
      .input-group label {
        font-size: 1.3rem;
      }
      input,
      select,
      textarea {
        font-size: 1.3rem;
        padding: 12px 16px;
        max-width: 150px;
      }
      button {
        font-size: 1.3rem;
        padding: 14px 28px;
      }
      .small-btn {
        font-size: 1rem;
        padding: 8px 16px;
      }
      .question-item {
        font-size: 1.2rem;
      }
      .report-table {
        font-size: 1rem;
      }
      .report-table th {
        font-size: 1.1rem;
      }
      button.nav-btn {
        font-size: 1.1rem;
        padding: 10px 20px;
      }
      .report-nav button {
        font-size: 1.1rem;
        padding: 8px 18px;
        min-width: 60px;
      }
      .report-nav .page-indicator {
        font-size: 1.3rem;
        min-width: 60px;
      }
      #reportStatsPage .table-wrapper table {
        font-size: 1rem;
      }
      #reportStatsPage .table-wrapper table th {
        font-size: 1.1rem;
        padding: 10px 8px;
      }
      #reportStatsPage .table-wrapper table td {
        padding: 10px 8px;
      }
    }

    .logo-upload-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .logo-upload-area img {
      max-height: 80px;
      max-width: 200px;
      object-fit: contain;
      border-radius: 12px;
      border: 2px dashed #c4b5fd;
      padding: 5px;
      background: white;
    }

    .logo-upload-area input[type="file"] {
      display: none;
    }

    .logo-upload-label {
      background: rgba(255, 255, 255, 0.6);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 1.8rem;
      color: #e53e3e;
      border: 2px dashed #c4b5fd;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      line-height: 1;
    }

    ::-webkit-scrollbar {
      width: 12px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 235, 245, 0.5);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #fda4af, #c4b5fd);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="app-container" id="appContainer">
    <!-- 第1页：登录页 -->
    <div id="loginPage" class="page active">
      <div class="card">
        <div class="logo-upload-area">
          <img id="schoolLogo" src="" alt="学校Logo" style="display: none;">
          <label for="logoFileInput" class="logo-upload-label">🍎</label>
          <input type="file" id="logoFileInput" accept=".jpg,.jpeg">
        </div>
        <h2>🌈 积极探究者的小课堂 🌈</h2>
        <div class="input-group">
          <label>🧸 姓名</label>
          <input type="text" id="teacherName" placeholder="你的名字" maxlength="5" value="">
        </div>
        <div class="input-group" id="teacherExtraFields">
          <label>📚 年级</label>
          <input type="text" id="grade" placeholder="如：三年级" maxlength="5" value="">
        </div>
        <div class="input-group" id="classFieldGroup">
          <label>🏫 班级</label>
          <input type="text" id="className" placeholder="如：2班" maxlength="5" value="">
        </div>
        <div class="input-group" id="subjectField">
          <label>📐 学科</label>
          <input type="text" id="subject" value="语文" maxlength="5" readonly style="background:rgba(255,240,245,0.8); cursor:default;">
        </div>
        <div id="studentOnlyName" class="student-login-area" style="display: none;">
          <p>🦋 扫码后输入你的名字，一起探究吧！</p>
        </div>
        <div style="text-align:center; margin-top:12px;">
          <button id="loginBtn">🌟 开启探究之旅</button>
        </div>
      </div>

          🔸 封闭题：谁是主人公？ / 什么时候发生的？<br>

    <!-- 第3页：学习报告页（分两子页） -->
    <div id="reportPage" class="page">
      <div class="card" style="flex:1; display:flex; flex-direction:column;">
        <!-- 标题栏 -->
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:12px;">
          <h2 style="margin-bottom:0; border-bottom:0; font-size:2.6rem;" id="reportMainTitle">📊 学习报告</h2>
          <p style="font-size:1.4rem; color:#5b3a4a; margin:0;">
            课文：<strong id="reportLessonTitle">-</strong> &nbsp;|&nbsp; 日期：<strong id="reportDate">-</strong>
          </p>

        <!-- 子页面容器 -->
        <div style="flex:1; display:flex; flex-direction:column; min-height:400px;">

          <!-- 第一页：统计 -->
          <div id="reportStatsPage" class="report-subpage active">
            <div class="table-wrapper" style="flex:1; display:flex; flex-direction:column;">
              <h3 style="font-size:2rem; margin:0 0 12px 0;">📋 提问与回答统计</h3>
              <div id="reportStatsContent" style="flex:1; display:flex; flex-direction:column;"></div>
            </div>
          </div>

          <!-- 第二页：个人反思 -->
          <div id="reportIndividualPage" class="report-subpage">
            <h3 style="font-size:2.2rem; margin:0 0 16px 0;">🌟 欣赏你的优秀之处，期待你的进步！</h3>
            <div id="reportIndividualContent" style="flex:1;"></div>

        </div>

        <!-- 报告导航 -->

  <!-- 弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      <button class="modal-close-btn" id="modalCloseBtn">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    (function() {
      const state = {
        currentUser: { name: '', role: 'teacher', grade: '', className: '' },
        lessonTitle: '金色的草地',
        lessonText: '',
        lessonType: 'text',
        pdfUrl: null,
        questions: [],
        allUsers: {}
      };

      const STORAGE_KEY = 'cute_classroom_login_v8';
      const LOGO_STORAGE_KEY = 'school_logo_v1';

      const rubricData = {
        closedQuestion: {
          title: '📋 封闭性提问评分细则',
          headers: ['分值', '评价标准'],
          rows: [
            ['4分', '问题完整、疑问词准确、紧扣课文原文、能用理解词句方法提问、逻辑精准、答案可在文中直接找到。'],
            ['3分', '问题完整、疑问词正确、贴合课文、逻辑通顺，但未运用词句理解学习方法。'],
            ['2分', '语句通顺、有疑问词、关联课文，但问题宽泛、重点不明确。'],
            ['1分', '句子残缺、无合适疑问词、脱离课文、逻辑混乱、无明确考查点。']
          ]
        },
        openQuestion: {
          title: '📋 开放性提问评分细则',
          headers: ['分值', '评价标准'],
          rows: [
            ['4分', '语句完整、疑问词恰当、紧扣课文情节人物、有深度思考与想象、结合生活实际、问题有趣、逻辑清晰。'],
            ['3分', '提问规范、贴合文本、有思考空间、无唯一答案，但缺少生活联结、趣味性弱。'],
            ['2分', '语句通顺、贴合课文，但思考空间小、拓展性弱、问题平淡。'],
            ['1分', '句子不完整、脱离文本、无思考价值、等同于简单封闭提问。']
          ]
        },
        closedAnswer: {
          title: '📋 回答封闭性问题评估细则',
          headers: ['分值', '评估标准'],
          rows: [
            ['4分', '能准确从文本提取信息，答案完整，关键信息全部答到；语句通顺，错别字极少或没有。'],
            ['3分', '能找到文本中正确信息，但回答缺少1个次要细节；语句基本通顺，少量错别字，不影响理解。'],
            ['2分', '能找到部分相关信息，但缺少关键信息；或信息有小偏差；回答简短，错别字较多，但大致能看懂意思。'],
            ['1分', '找不到文本对应信息；答案和文本无关；几乎没有有效作答。']
          ]
        },
        openAnswer: {
          title: '📋 回答开放性问题评估细则',
          headers: ['分值', '评估标准'],
          rows: [
            ['4分', '回答能结合文本内容，说出清楚理由/想法；表达完整；可以简单联系生活；允许简短，少量错别字不影响意思。'],
            ['3分', '能联系文本，但理由简单、不够充分；想法合理；表达基本完整，有少量语病或错别字。'],
            ['2分', '有自己想法，但没有结合文本，只说个人感受；或想法比较片面；回答简短，表达不完整。'],
            ['1分', '回答与文本、问题无关；只有只言片语，没有有效观点；不作答。']
          ]
        }
      };

      // Logo 处理
      const logoImg = document.getElementById('schoolLogo');
      const logoFileInput = document.getElementById('logoFileInput');

      function loadLogo() {
        const savedLogo = localStorage.getItem(LOGO_STORAGE_KEY);
        if (savedLogo) {
          logoImg.src = savedLogo;
          logoImg.style.display = 'block';
        }
      }
      loadLogo();

      logoFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.match(/image\/jpeg/)) {
          alert('请上传JPG格式的图片');
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const base64 = ev.target.result;
          localStorage.setItem(LOGO_STORAGE_KEY, base64);
          logoImg.src = base64;
          logoImg.style.display = 'block';
        };
        reader.readAsDataURL(file);
      });

      function loadSavedLogin() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const data = JSON.parse(saved);
            document.getElementById('teacherName').value = data.name || '';
            document.getElementById('grade').value = data.grade || '';
            document.getElementById('className').value = data.className || '';
            if (data.lessonTitle) {
              document.getElementById('lessonTitleInput').value = data.lessonTitle;
              state.lessonTitle = data.lessonTitle;
              document.getElementById('currentLessonTitle').textContent = data.lessonTitle;
            }
            if (data.lessonText) state.lessonText = data.lessonText;
            if (data.allUsers) state.allUsers = data.allUsers;
            if (data.questions) state.questions = data.questions;
          } catch (e) {}
        }
      }

      function saveAllData() {
        const data = {
          name: state.currentUser.name,
          grade: state.currentUser.grade,
          className: state.currentUser.className,
          lessonTitle: state.lessonTitle,
          lessonText: state.lessonText,
          allUsers: state.allUsers,
          questions: state.questions
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
      }

      function registerUserAction(name, role, actionType, content, scores) {
        if (!state.allUsers[name]) {
          state.allUsers[name] = { role, questions: [], answers: [] };
        }
        if (actionType === 'question') {
          state.allUsers[name].questions.push({ text: content, scores });
        } else if (actionType === 'answer') {
          state.allUsers[name].answers.push({ text: content, scores });
        }
        saveAllData();
      }

      const modalOverlay = document.getElementById('modalOverlay');
      const modalBody = document.getElementById('modalBody');
      const modalCloseBtn = document.getElementById('modalCloseBtn');

      function showRubricModal(rubricKey) {
        const data = rubricData[rubricKey];
        if (!data) return;
        let html = `<h3>${data.title}</h3><table><thead><tr>`;
        data.headers.forEach(h => html += `<th>${h}</th>`);
        html += `</tr></thead><tbody>`;
        data.rows.forEach(row => {
          html += `<tr>`;
          row.forEach(cell => html += `<td>${cell}</td>`);
          html += `</tr>`;
        });
        html += `</tbody></table>`;
        modalBody.innerHTML = html;
        modalOverlay.classList.add('active');
      }

      function hideModal() {
        modalOverlay.classList.remove('active');
      }
      modalCloseBtn.addEventListener('click', hideModal);
      modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) hideModal(); });

      const loginPage = document.getElementById('loginPage');
      const directoryPage = document.getElementById('directoryPage');
      const interactionPage = document.getElementById('interactionPage');
      const reportPage = document.getElementById('reportPage');
      const loginBtn = document.getElementById('loginBtn');
      const teacherExtraFields = document.getElementById('teacherExtraFields');
      const classFieldGroup = document.getElementById('classFieldGroup');
      const subjectField = document.getElementById('subjectField');
      const studentOnlyName = document.getElementById('studentOnlyName');
      const loadLessonBtn = document.getElementById('loadLessonBtn');
      const lessonTitleInput = document.getElementById('lessonTitleInput');
      const textFileUpload = document.getElementById('textFileUpload');
      const lessonContentDiv = document.getElementById('lessonContent');
      const pdfViewer = document.getElementById('pdfViewer');
      const textDisplayArea = document.getElementById('textDisplayArea');
      const hideTextBtn = document.getElementById('hideTextBtn');
      const showTextBtn = document.getElementById('showTextBtn');
      const postQuestionBtn = document.getElementById('postQuestionBtn');
      const newQuestionInput = document.getElementById('newQuestionInput');
      const questionsContainer = document.getElementById('questionsContainer');
      const generateQRBtn = document.getElementById('generateQRBtn');
      const qrDisplayArea = document.getElementById('qrDisplayArea');
      const qrCodeContainer = document.getElementById('qrCodeContainer');

      // 报告分页元素
      const reportStatsPage = document.getElementById('reportStatsPage');
      const reportIndividualPage = document.getElementById('reportIndividualPage');
      const reportStatsContent = document.getElementById('reportStatsContent');
      const reportIndividualContent = document.getElementById('reportIndividualContent');
      const reportPrevBtn = document.getElementById('reportPrevBtn');
      const reportNextBtn = document.getElementById('reportNextBtn');
      const reportPageIndicator = document.getElementById('reportPageIndicator');

      let currentReportPage = 0; // 0=统计, 1=个人

      function switchReportPage(index) {
        currentReportPage = index;
        if (index === 0) {
          reportStatsPage.classList.add('active');
          reportIndividualPage.classList.remove('active');
          reportPrevBtn.disabled = true;
          reportNextBtn.disabled = false;
          reportPageIndicator.textContent = '1 / 2';
        } else {
          reportStatsPage.classList.remove('active');
          reportIndividualPage.classList.add('active');
          reportPrevBtn.disabled = false;
          reportNextBtn.disabled = true;
          reportPageIndicator.textContent = '2 / 2';
        }
      }

      reportPrevBtn.addEventListener('click', () => { if (currentReportPage === 1) switchReportPage(0); });
      reportNextBtn.addEventListener('click', () => { if (currentReportPage === 0) switchReportPage(1); });

      const urlParams = new URLSearchParams(window.location.search);
      const isStudentEntry = urlParams.get('student') === '1';

      function configureLoginUI() {
        if (isStudentEntry) {
          teacherExtraFields.style.display = 'none';
          classFieldGroup.style.display = 'none';
          subjectField.style.display = 'none';
          studentOnlyName.style.display = 'block';
          document.getElementById('teacherName').placeholder = '你的名字';
        } else {
          teacherExtraFields.style.display = 'flex';
          classFieldGroup.style.display = 'flex';
          subjectField.style.display = 'flex';
          studentOnlyName.style.display = 'none';
        }
      }
      configureLoginUI();
      loadSavedLogin();

      if (!state.lessonText) {
        state.lessonText = '《金色的草地》\n\n我们住在乡下，窗前是一大片草地。草地上长满了蒲公英。\n当蒲公英盛开的时候，这片草地就变成金色的了。\n\n我和弟弟常常在草地上玩耍。有一次，弟弟跑在我前面，\n我装着很严肃的样子，喊："谢廖沙！"\n他回过头来，我就使劲一吹，把蒲公英的绒毛吹到他脸上。\n弟弟也假装打哈欠，把蒲公英的绒毛朝我脸上吹。\n\n就这样，这些并不引人注目的蒲公英，\n给我们带来了不少快乐。';
      }

      function showPage(page) {
        [loginPage, directoryPage, interactionPage, reportPage].forEach(p => p.classList.remove('active'));
        page.classList.add('active');
      }

      document.getElementById('toPage2From1').addEventListener('click', () => {
        if (!state.currentUser.name) {
          const name = document.getElementById('teacherName').value.trim();
          if (!name) { alert('请先登录或输入姓名~ 🌸'); return; }
          state.currentUser = { name, role: 'teacher', grade: document.getElementById('grade').value.trim() || '三年级',
          className: document.getElementById('className').value.trim() || '1班' };
          saveAllData();
        }
        showPage(directoryPage);
      });

      document.getElementById('backTo1').addEventListener('click', () => showPage(loginPage));
      document.getElementById('toPage3').addEventListener('click', () => {
        generateReport();
        showPage(reportPage);
        switchReportPage(0);
      });
      document.getElementById('backToDirectory').addEventListener('click', () => showPage(directoryPage));
      document.getElementById('toReportPage').addEventListener('click', () => {
        generateReport();
        showPage(reportPage);
        switchReportPage(0);
      });
      document.getElementById('backToInteraction').addEventListener('click', () => showPage(interactionPage));

      loginBtn.addEventListener('click', () => {
        const name = document.getElementById('teacherName').value.trim();
        if (!name) { alert('请写下你的名字哦~ 🌸'); return; }
        if (isStudentEntry) {
          state.currentUser = { name, role: 'student', grade: '', className: '' };
          updateLessonDisplayInInteraction();
          renderAllQuestions();
          showPage(interactionPage);
        } else {
          const grade = document.getElementById('grade').value.trim() || '三年级';
          const className = document.getElementById('className').value.trim() || '1班';
          state.currentUser = { name, role: 'teacher', grade, className };
          saveAllData();
          showPage(directoryPage);
        }
      });

      textFileUpload.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        try {
          if (ext === 'txt' || ext === 'md') {
            const reader = new FileReader();
            reader.onload = (ev) => { state.lessonText = ev.target.result;
              state.lessonType = 'text';
              saveAllData();
              alert('课文上传成功！🌸'); };
            reader.readAsText(file, 'UTF-8');
          } else if (ext === 'docx') {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer });
            state.lessonText = result.value || '(文档无文字)';
            state.lessonType = 'text';
            saveAllData();
            alert('Word文档解析成功！📝');
          } else if (ext === 'pptx') {
            const arrayBuffer = await file.arrayBuffer();
            const zip = await JSZip.loadAsync(arrayBuffer);
            let text = '';
            const slideFiles = Object.keys(zip.files).filter(f => f.startsWith('ppt/slides/slide') && f.endsWith('.xml'));
            for (const sf of slideFiles) {
              const content = await zip.files[sf].async('text');
              const matches = content.match(/<a:t>([^<]*)<\/a:t>/g);
              if (matches) text += matches.map(m => m.replace(/<[^>]+>/g, '')).join(' ') + '\n';
            }
            state.lessonText = text || '(PPT无文本)';
            state.lessonType = 'text';
            saveAllData();
            alert('PPT解析成功！📊');
          } else if (ext === 'pdf') {
            const url = URL.createObjectURL(file);
            if (state.pdfUrl) URL.revokeObjectURL(state.pdfUrl);
            state.pdfUrl = url;
            state.lessonType = 'pdf';
            state.lessonText = '[PDF文件]';
            saveAllData();
            alert('PDF上传成功！📄');
          }
        } catch (error) { alert('文件解析失败：' + error.message); }
      });

      loadLessonBtn.addEventListener('click', () => {
        state.lessonTitle = lessonTitleInput.value.trim() || '课文';
        document.getElementById('currentLessonTitle').textContent = state.lessonTitle;
        document.getElementById('interactionLessonTitle').textContent = '📖 ' + state.lessonTitle;
        saveAllData();
        updateLessonDisplayInInteraction();
        renderAllQuestions();
        showPage(interactionPage);
      });

      function updateLessonDisplayInInteraction() {
        if (state.lessonType === 'pdf' && state.pdfUrl) {
          lessonContentDiv.style.display = 'none';
          pdfViewer.style.display = 'block';
          pdfViewer.src = state.pdfUrl;
        } else {
          lessonContentDiv.style.display = 'block';
          pdfViewer.style.display = 'none';
          lessonContentDiv.textContent = state.lessonText || '暂无课文内容，请先上传哦~ 📖';
        }
        document.getElementById('interactionLessonTitle').textContent = '📖 ' + state.lessonTitle;
      }

      hideTextBtn.addEventListener('click', () => { textDisplayArea.style.display = 'none';
        hideTextBtn.style.display = 'none';
        showTextBtn.style.display = 'inline-block'; });
      showTextBtn.addEventListener('click', () => { textDisplayArea.style.display = 'block';
        showTextBtn.style.display = 'none';
        hideTextBtn.style.display = 'inline-block'; });

      generateQRBtn.addEventListener('click', () => { qrDisplayArea.style.display = 'block';
        qrCodeContainer.innerHTML = '';
        const baseUrl = window.location.href.split('?')[0];
        new QRCode(qrCodeContainer, { text: baseUrl + '?student=1', width: 200, height: 200, colorDark: '#d6336c',
          colorLight: '#ffffff' }); });

      function initSyncChannel() {
        if (typeof BroadcastChannel !== 'undefined') {
          state.syncChannel = new BroadcastChannel('cute_teaching_sync_v8');
          state.syncChannel.onmessage = (event) => {
            if (event.data) {
              if (event.data.type === 'QUESTIONS_UPDATE') { state.questions = event.data.questions;
                renderAllQuestions();
                saveAllData(); }
              if (event.data.type === 'REQUEST_SYNC') broadcastQuestions();
            }
          };
        }
      }
      initSyncChannel();

      function broadcastQuestions() {
        if (state.syncChannel) state.syncChannel.postMessage({ type: 'QUESTIONS_UPDATE', questions: state.questions });
      }

      postQuestionBtn.addEventListener('click', () => {
        const text = newQuestionInput.value.trim();
        if (!text) return;
        const question = {
          id: generateId(),
          text,
          author: state.currentUser.name || '小探究者',
          versions: [{ text, author: state.currentUser.name || '小探究者' }],
          answers: [],
          scores: { student: null, teacher: null }
        };
        state.questions.push(question);
        registerUserAction(state.currentUser.name, state.currentUser.role, 'question', text, { student: null,
          teacher: null });
        newQuestionInput.value = '';
        renderAllQuestions();
        broadcastQuestions();
      });

      function addAnswer(qId, text, anonymous) {
        const q = state.questions.find(q => q.id === qId);
        if (!q) return;
        const authorName = anonymous ? '匿名小可爱' : (state.currentUser.name || '同学');
        q.answers.push({
          id: generateId(),
          text,
          author: authorName,
          isAnonymous: anonymous,
          versions: [{ text, author: authorName }],
          scores: { student: null, teacher: null },
          realAuthor: anonymous ? state.currentUser.name : null
        });
        registerUserAction(authorName, state.currentUser.role, 'answer', text, { student: null, teacher: null });
        renderAllQuestions();
        broadcastQuestions();
      }

      function modifyEntity(entity, newText) {
        if (!entity.versions) entity.versions = [{ text: entity.text, author: entity.author }];
        if (entity.versions.length >= 3) { alert('最多修改两次哦~ 🌸'); return false; }
        entity.versions.push({ text: newText, author: state.currentUser.name || '修改小助手' });
        entity.text = newText;
        return true;
      }

      function setQuestionScore(qId, type, val) {
        const q = state.questions.find(q => q.id === qId);
        if (!q) return;
        q.scores[type] = val;
        if (state.allUsers[q.author] && state.allUsers[q.author].questions.length > 0) {
          const lastQ = state.allUsers[q.author].questions[state.allUsers[q.author].questions.length - 1];
          if (lastQ.text === q.text) lastQ.scores = q.scores;
        }
        renderAllQuestions();
        broadcastQuestions();
      }

      function setAnswerScore(qId, aId, type, val) {
        const q = state.questions.find(q => q.id === qId);
        if (!q) return;
        const a = q.answers.find(a => a.id === aId);
        if (!a) return;
        if (!a.scores) a.scores = { student: null, teacher: null };
        a.scores[type] = val;
        const userName = a.isAnonymous && a.realAuthor ? a.realAuthor : a.author;
        if (state.allUsers[userName] && state.allUsers[userName].answers.length > 0) {
          const lastA = state.allUsers[userName].answers[state.allUsers[userName].answers.length - 1];
          if (lastA.text === a.text) lastA.scores = a.scores;
        }
        renderAllQuestions();
        broadcastQuestions();
      }

      function calcAvg(scores) {
        let sum = 0,
          c = 0;
        if (scores.student != null) { sum += scores.student;
          c++; }
        if (scores.teacher != null) { sum += scores.teacher;
          c++; }
        return c > 0 ? (sum / c).toFixed(1) : '—';
      }

      function renderAllQuestions() {
        if (!questionsContainer) return;
        questionsContainer.innerHTML = '';
        if (!state.questions.length) {
          questionsContainer.innerHTML =
            '<p style="color:#b07a8e; padding:30px; text-align:center; font-size:1.8rem;">💬 暂无问题，快提出第一个问题吧！</p>';
          return;
        }
        state.questions.forEach(q => {
          const card = document.createElement('div');
          card.className = 'question-item';
          let vHtml = q.versions.map((v, i) =>
              `<div class="version-block">📝 版本${i+1}: ${v.text} <span style="font-size:1.2rem; color:#b07a8e;">(${v.author})</span></div>`
              ).join('');
          let answersHtml = q.answers.map(a => {
            let avHtml = a.versions ? a.versions.map((av, i) =>
                `<div class="version-block">💬 答案v${i+1}: ${av.text} <span style="font-size:1.2rem;">(${av.author})</span></div>`
              ).join('') : `<div>${a.text}</div>`;
            const aScores = a.scores || { student: null, teacher: null };
            return `<div class="answer-row">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                <strong style="color:#d6336c;">🗣️ ${a.author}</strong> ${a.isAnonymous ? '<span style="color:#b07a8e;">(匿名)</span>' : ''}
                <span class="score-badge">⭐ 答案均分 ${calcAvg(aScores)}</span>
              </div>
              ${avHtml}
              <div class="flex-row" style="justify-content:flex-start; margin-top:10px; gap:6px;">
                <button class="small-btn secondary modify-a" data-qid="${q.id}" data-aid="${a.id}">✏️ 修改答案</button>
              </div>
              <div class="answer-score-row"><span style="font-size:1.2rem; color:#b07a8e;">👩‍🎓学生评估:</span>${[4,3,2,1].map(v => `<button class="small-btn secondary answer-score-s" data-qid="${q.id}" data-aid="${a.id}" data-val="${v}" style="min-width:40px; padding:6px 12px;">${v}</button>`).join('')}</div>
              <div class="answer-score-row"><span style="font-size:1.2rem; color:#b07a8e;">👨‍🏫老师评估:</span>${[4,3,2,1].map(v => `<button class="small-btn secondary answer-score-t" data-qid="${q.id}" data-aid="${a.id}" data-val="${v}" style="min-width:40px; padding:6px 12px;">${v}</button>`).join('')}</div>
            </div>`;
          }).join('');
          card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
              <strong style="color:#8b5cf6;">❓ ${q.author} 提问</strong>
              <span class="score-badge">⭐ 问题均分 ${calcAvg(q.scores)}</span>
            </div>
            <div style="margin:12px 0;">${vHtml || `<div style="color:#5b3a4a;">${q.text}</div>`}</div>
            <div class="flex-row" style="justify-content:flex-start; gap:10px; margin-top:12px;">
              <button class="small-btn secondary modify-q" data-id="${q.id}">✏️ 修改问题</button>
              <button class="small-btn answer-btn" data-id="${q.id}">💬 回答</button>
            </div>
            <div class="flex-row" style="margin-top:12px; font-size:1.3rem; gap:6px; justify-content:flex-start;">
              <span style="color:#b07a8e;">👩‍🎓学生评估:</span>${[4,3,2,1].map(v => `<button class="small-btn secondary score-s" data-id="${q.id}" data-val="${v}" style="min-width:40px; padding:6px 12px;">${v}分</button>`).join('')}
              <span style="color:#b07a8e; margin-left:6px;">👨‍🏫老师评估:</span>${[4,3,2,1].map(v => `<button class="small-btn secondary score-t" data-id="${q.id}" data-val="${v}" style="min-width:40px; padding:6px 12px;">${v}分</button>`).join('')}
            </div>
            <div style="margin-top:14px;">${answersHtml}</div>`;
          questionsContainer.appendChild(card);
        });
        document.querySelectorAll('.modify-q').forEach(b => b.addEventListener('click', (e) => {
          const q = state.questions.find(q => q.id === e.target.dataset.id);
          const t = prompt('输入修改后的问题:', q.text);
          if (t && t.trim() && modifyEntity(q, t.trim())) { renderAllQuestions();
            broadcastQuestions(); }
        }));
        document.querySelectorAll('.answer-btn').forEach(b => b.addEventListener('click', (e) => {
          const t = prompt('输入你的回答:');
          if (t && t.trim()) addAnswer(e.target.dataset.id, t.trim(), confirm('是否匿名回答？'));
        }));
        document.querySelectorAll('.score-s').forEach(b => b.addEventListener('click', (e) => setQuestionScore(e.target
          .dataset.id, 'student', +e.target.dataset.val)));
        document.querySelectorAll('.score-t').forEach(b => b.addEventListener('click', (e) => setQuestionScore(e.target
          .dataset.id, 'teacher', +e.target.dataset.val)));
        document.querySelectorAll('.modify-a').forEach(b => b.addEventListener('click', (e) => {
          const q = state.questions.find(q => q.id === e.target.dataset.qid);
          const a = q.answers.find(a => a.id === e.target.dataset.aid);
          const t = prompt('修改答案:', a.text);
          if (t && t.trim() && modifyEntity(a, t.trim())) { renderAllQuestions();
            broadcastQuestions(); }
        }));
        document.querySelectorAll('.answer-score-s').forEach(b => b.addEventListener('click', (e) => setAnswerScore(e
          .target.dataset.qid, e.target.dataset.aid, 'student', +e.target.dataset.val)));
        document.querySelectorAll('.answer-score-t').forEach(b => b.addEventListener('click', (e) => setAnswerScore(e
          .target.dataset.qid, e.target.dataset.aid, 'teacher', +e.target.dataset.val)));
      }

      // ======================= 核心：生成两页报告 =======================
      function generateReport() {
        document.getElementById('reportLessonTitle').textContent = state.lessonTitle;
        const now = new Date();
        document.getElementById('reportDate').textContent =
          `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

        const users = Object.keys(state.allUsers);

        // ---- 第一页：统计表格 ----
        let statsHtml = '';
        if (users.length === 0) {
          statsHtml = '<p style="font-size:1.8rem; text-align:center; color:#b07a8e; padding:40px 0;">暂无学习数据，快去提问和回答吧~ 🌸</p>';
        } else {
          statsHtml += `<div style="flex:1; display:flex; flex-direction:column; min-height:300px;">`;
          statsHtml += `<table class="report-table" style="width:100%; border-collapse:collapse; font-size:1.4rem; background:rgba(255,255,255,0.8); border-radius:20px; overflow:hidden; flex:1;">`;
          statsHtml +=
            `<thead><tr><th style="background:linear-gradient(135deg,#fda4af,#c4b5fd); color:white; padding:16px; font-weight:700; font-size:1.5rem;">序号</th><th style="background:linear-gradient(135deg,#fda4af,#c4b5fd); color:white; padding:16px; font-weight:700; font-size:1.5rem;">姓名</th><th style="background:linear-gradient(135deg,#fda4af,#c4b5fd); color:white; padding:16px; font-weight:700; font-size:1.5rem;">角色</th><th style="background:linear-gradient(135deg,#fda4af,#c4b5fd); color:white; padding:16px; font-weight:700; font-size:1.5rem;">提问次数</th><th style="background:linear-gradient(135deg,#fda4af,#c4b5fd); color:white; padding:16px; font-weight:700; font-size:1.5rem;">回答次数</th><th style="background:linear-gradient(135deg,#fda4af,#c4b5fd); color:white; padding:16px; font-weight:700; font-size:1.5rem;">总互动次数</th></tr></thead><tbody>`;
          users.forEach((user, idx) => {
            const u = state.allUsers[user];
            statsHtml +=
              `<tr><td style="padding:14px 16px; border-bottom:2px solid rgba(249,168,212,0.3); color:#5b3a4a; text-align:center;">${idx+1}</td><td style="padding:14px 16px; border-bottom:2px solid rgba(249,168,212,0.3); color:#5b3a4a; text-align:center;"><strong>${user}</strong></td><td style="padding:14px 16px; border-bottom:2px solid rgba(249,168,212,0.3); color:#5b3a4a; text-align:center;">${u.role === 'teacher' ? '👨‍🏫 老师' : '👩‍🎓 学生'}</td><td style="padding:14px 16px; border-bottom:2px solid rgba(249,168,212,0.3); color:#5b3a4a; text-align:center;">${u.questions.length}</td><td style="padding:14px 16px; border-bottom:2px solid rgba(249,168,212,0.3); color:#5b3a4a; text-align:center;">${u.answers.length}</td><td style="padding:14px 16px; border-bottom:2px solid rgba(249,168,212,0.3); color:#5b3a4a; text-align:center;">${u.questions.length + u.answers.length}</td></tr>`;
          });
          statsHtml += `</tbody></table></div>`;
        }
        reportStatsContent.innerHTML = statsHtml;

        // ---- 第二页：个人反思 ----
        let indHtml = '';
        if (users.length === 0) {
          indHtml =
            '<p style="font-size:1.8rem; text-align:center; color:#b07a8e; padding:40px 0;">暂无学习数据，快去提问和回答吧~ 🌸</p>';
        } else {
          users.forEach(user => {
            const u = state.allUsers[user];
            // 收集该用户所有提问的均分
            const qItems = u.questions.map(q => {
              const avg = calcAvg(q.scores);
              return { text: q.text, avg: parseFloat(avg) || 0, scores: q.scores, type: '提问' };
            });
            // 收集该用户所有回答的均分
            const aItems = u.answers.map(a => {
              const avg = calcAvg(a.scores);
              return { text: a.text, avg: parseFloat(avg) || 0, scores: a.scores, type: '回答' };
            });

            // 分别找提问最高/最低，回答最高/最低
            let qHighest = null,
              qLowest = null;
            if (qItems.length > 0) {
              qItems.sort((a, b) => b.avg - a.avg);
              qHighest = qItems[0];
              qLowest = qItems[qItems.length - 1];
            }
            let aHighest = null,
              aLowest = null;
            if (aItems.length > 0) {
              aItems.sort((a, b) => b.avg - a.avg);
              aHighest = aItems[0];
              aLowest = aItems[aItems.length - 1];
            }

            indHtml += `<div class="individual-card">
              <div class="user-name">👤 ${user} <span style="font-size:1.2rem; color:#b07a8e; font-weight:400;">${u.role === 'teacher' ? '（老师）' : '（学生）'}</span></div>
              <div class="dimension-grid">
                <div class="dimension-item" style="border-left-color:#f9a8d4;">
                  <span class="label">💬 提问最高分</span>
                  ${qHighest ? `<div class="text">「${qHighest.text.substring(0,40)}${qHighest.text.length>40?'...':''}」</div><div class="score">⭐ 均分：${qHighest.avg}（学生:${qHighest.scores.student??'-'} / 老师:${qHighest.scores.teacher??'-'}）</div>` : '<div class="no-data">暂无提问评分</div>'}
                </div>
                <div class="dimension-item" style="border-left-color:#fda4af;">
                  <span class="label">📉 提问最低分</span>
                  ${qLowest ? `<div class="text">「${qLowest.text.substring(0,40)}${qLowest.text.length>40?'...':''}」</div><div class="score">⭐ 均分：${qLowest.avg}（学生:${qLowest.scores.student??'-'} / 老师:${qLowest.scores.teacher??'-'}）</div>` : '<div class="no-data">暂无提问评分</div>'}
                </div>
                <div class="dimension-item" style="border-left-color:#93c5fd;">
                  <span class="label">🗣️ 回答最高分</span>
                  ${aHighest ? `<div class="text">「${aHighest.text.substring(0,40)}${aHighest.text.length>40?'...':''}」</div><div class="score">⭐ 均分：${aHighest.avg}（学生:${aHighest.scores.student??'-'} / 老师:${aHighest.scores.teacher??'-'}）</div>` : '<div class="no-data">暂无回答评分</div>'}
                </div>
                <div class="dimension-item" style="border-left-color:#c4b0f0;">
                  <span class="label">📊 回答最低分</span>
                  ${aLowest ? `<div class="text">「${aLowest.text.substring(0,40)}${aLowest.text.length>40?'...':''}」</div><div class="score">⭐ 均分：${aLowest.avg}（学生:${aLowest.scores.student??'-'} / 老师:${aLowest.scores.teacher??'-'}）</div>` : '<div class="no-data">暂无回答评分</div>'}
                </div>
              </div>
            </div>`;
          });
        }
        reportIndividualContent.innerHTML = indHtml;

        // 重置到第一页
        switchReportPage(0);
      }

      // ======================= 导出功能（保持原有） =======================
      function generateExportContent(format) {
        const now = new Date();
        const dateStr =
          `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        let content = '';
        const users = Object.keys(state.allUsers);
        if (format === 'word') {
          content =
            `<html><head><meta charset="UTF-8"><style>body{font-family:'KaiTi',sans-serif;font-size:16px;}h2{color:#d6336c;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #ccc;padding:8px;text-align:center;}th{background:#fda4af;color:white;}</style></head><body>`;
          content += `<h2>📊 学习报告 - ${state.lessonTitle}</h2>`;
          content += `<p>日期：${dateStr}</p>`;
          content += `<h3>课文内容</h3><p>${state.lessonText.replace(/\n/g,'<br>')}</p>`;
          content += `<h3>提问与回答详情</h3>`;
          state.questions.forEach((q, i) => {
            content += `<p><strong>问题${i+1}：</strong>${q.text} (提问人: ${q.author}) | 均分: ${calcAvg(q.scores)}</p>`;
            q.answers.forEach((a, j) => {
              content +=
                `<p style="margin-left:20px;">回答${j+1}：${a.text} (回答人: ${a.author}${a.isAnonymous?' (匿名)':''}) | 均分: ${calcAvg(a.scores||{student:null,teacher:null})}</p>`;
            });
          });
          content += `<h3>学生统计</h3><table><tr><th>姓名</th><th>提问次数</th><th>回答次数</th></tr>`;
          users.forEach(u => { content +=
              `<tr><td>${u}</td><td>${state.allUsers[u].questions.length}</td><td>${state.allUsers[u].answers.length}</td></tr>`; });
          content += `</table></body></html>`;
        } else if (format === 'excel') {
          let csv = '姓名,角色,类型,内容,学生评分,老师评分,平均分\n';
          state.questions.forEach(q => {
            csv +=
              `"${q.author}","提问者","提问","${q.text}",${q.scores.student??''},${q.scores.teacher??''},${calcAvg(q.scores)}\n`;
            q.answers.forEach(a => {
              csv +=
                `"${a.author}","回答者","回答","${a.text}",${(a.scores||{}).student??''},${(a.scores||{}).teacher??''},${calcAvg(a.scores||{student:null,teacher:null})}\n`;
            });
          });
          content = csv;
        }
        return { content, dateStr };
      }

      document.getElementById('exportWordBtn').addEventListener('click', () => {
        const { content } = generateExportContent('word');
        const blob = new Blob([content], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `学习报告_${state.lessonTitle}_${new Date().toISOString().split('T')[0]}.doc`;
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('exportExcelBtn').addEventListener('click', () => {
        const { content } = generateExportContent('excel');
        const BOM = '\uFEFF';
        const blob = new Blob([BOM + content], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `学习报告_${state.lessonTitle}_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // 评估细则弹窗
      document.getElementById('showClosedQuestionRubric').addEventListener('click', () => showRubricModal('closedQuestion'));
      document.getElementById('showOpenQuestionRubric').addEventListener('click', () => showRubricModal('openQuestion'));
      document.getElementById('showClosedAnswerRubric').addEventListener('click', () => showRubricModal('closedAnswer'));
      document.getElementById('showOpenAnswerRubric').addEventListener('click', () => showRubricModal('openAnswer'));

      window.addEventListener('load', () => {
        document.getElementById('currentLessonTitle').textContent = state.lessonTitle;
        document.getElementById('interactionLessonTitle').textContent = '📖 ' + state.lessonTitle;
        if (lessonContentDiv) lessonContentDiv.textContent = state.lessonText;
      });
    })();
  </script>
</body>
</html>
